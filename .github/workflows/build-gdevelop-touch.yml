name: Build GDevelop touch prototype

on:
  push:
    branches: [main]
    paths:
      - 'gdevelop/game-fixed2.json'
      - 'gdevelop/touch-controls.js'
      - 'gdevelop/build_touch.py'
      - '.github/workflows/build-gdevelop-touch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate touch project
        run: python gdevelop/build_touch.py
      - name: Commit generated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gdevelop/game-touch.json
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Build GDevelop touch prototype 0.1.3'
          git push
