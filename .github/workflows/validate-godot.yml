name: Validate Godot project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse and import project headlessly
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit --path .

      - name: Smoke-run main scene
        run: |
          timeout 12s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then
            exit "$status"
          fi
