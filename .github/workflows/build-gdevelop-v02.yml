name: Build GDevelop v0.2

on:
  push:
    branches: [main]
    paths:
      - 'gdevelop/game-touch.json'
      - 'gdevelop/gameplay-v02.js'
      - 'gdevelop/build_v02.py'
      - '.github/workflows/build-gdevelop-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate Bosco Occidentale slice
        run: python gdevelop/build_v02.py
      - name: Commit generated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gdevelop/game-v0.2.json
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Build DISTACCO Bosco Occidentale v0.2'
          git push
